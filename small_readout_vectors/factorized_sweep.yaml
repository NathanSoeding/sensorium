entity: ecker-lab
project: small readout vectors
method: bayes

metric:
  name: score
  goal: maximize

parameters:
  hidden_channels:
    values: [64, 96, 128]
  
  input_kern:
    values: [9, 11, 13]
  
  hidden_kern:
    values: [3, 5, 7]
  
  feature_reg_weight:
    distribution: uniform
    min: 0.0
    max: 12.0

  retinotopy_d:
    values: [5, 10, 20, 40, 80]
  
  retinotopy_layers:
    values: [0, 1, 2]

  max_freq:
    values: [3, 4, 5, 6]
  
program: run_factorized_sweep.py