entity: ecker-lab
project: small readout vectors
method: bayes

metric:
  name: knn_consistency
  goal: maximize

parameters:
  bottleneck_hidden_dim:
    values: [64]
  
  bottleneck_latent_dim:
    values: [50, 49, 48, 47, 46, 45, 44, 43, 42, 41, 40]

  feature_reg_weight:
    distribution: uniform
    min: 1.0
    max: 48.0

  finetune_lr_scale:
    values: [0.1]

  barlow_w:
    distribution: uniform
    min: 0.0
    max: 100000.0

program: run_sweep.py
