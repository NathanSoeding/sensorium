entity: ecker-lab
project: small readout vectors
method: bayes

metric:
  name: knn_consistency
  goal: maximize

parameters:
  bottleneck_hidden_dim:
    values: [64, 128, 256, 512]
  
  bottleneck_latent_dim:
    values: [64, 48, 32, 24, 16]

  feature_reg_weight:
    distribution: log_uniform_values
    min: 1.0
    max: 48.0

  finetune_lr_scale:
    values: [0, 0.01, 0.1]

  barlow_w:
    distribution: log_uniform_values
    min: 100.0
    max: 100000.0

program: run_sweep.py
